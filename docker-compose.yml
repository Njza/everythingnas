services:
  nas-search:
    image: python:3.15-slim
    command: python -u /app/nas_search.py
    environment:
      NAS_NAME: NAS          # optional: only shown; the search bar opens files by the address in its settings
      SCAN_MINUTES: 30       # full rescan interval; each scan wakes the disks
      SKIP_SHARES: homes     # shared folders not to search, comma-separated; homes = every user's own folder
      # This NAS's DSM, as the container reaches it: each person then logs in with their own NAS account and finds
      # only the shared folders DSM lets that account open. "" turns logins off: everyone finds every file.
      DSM_URL: https://host.docker.internal:5001
    extra_hosts:
      - host.docker.internal:host-gateway   # the NAS itself, as seen from inside the container
    volumes:
      # This folder, writable: the web page's 更新并重启 replaces nas_search.py in it
      - .:/app
      # DSM's own certificate: the server speaks HTTPS with it, so NAS passwords never cross the LAN in plain text.
      # Without it the server refuses NAS logins (DSM_URL); with DSM_URL "" it then speaks plain HTTP.
      - /usr/syno/etc/certificate/system/default:/cert:ro
      # Every shared folder on storage volume 1, read-only. Synology's own folders (@appstore, @docker...),
      # #recycle and #snapshot are skipped. Everyone on the LAN who can reach port 8765 can search these
      # file names if DSM_URL is "".
      - /volume1:/data/volume1:ro
      # A second storage volume: uncomment. Only if it exists, or Docker creates an empty /volume2.
      # - /volume2:/data/volume2:ro
      # Only some shared folders instead: delete the /volume1 line and list them, keeping the share name:
      # - /volume1/video:/data/video:ro
    ports:
      - "8765:8765"
    restart: unless-stopped
